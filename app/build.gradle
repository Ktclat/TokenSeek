plugins {
    id 'com.android.application'
}

android {
    namespace 'io.tokenseek.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.tokenseek.app'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.10.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Older checkouts generated a complete website under src/main/assets/site.
    // Keep that ignored build output outside the production APK on incremental upgrades.
    sourceSets.main.assets.setSrcDirs(['src/main/nativeAssets'])
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// Android screens must remain native in every build variant, including upgrades.
def verifyNativeScreens = tasks.register('verifyNativeScreens') {
    def sources = fileTree('src') {
        include '**/java/**/*.java', '**/kotlin/**/*.kt', '**/res/layout*/*.xml', '**/AndroidManifest.xml'
        exclude 'test/**', 'androidTest/**', 'main/assets/site/**'
    }
    def pages = fileTree('src') {
        include '**/*.html', '**/*.htm', '**/*.js', '**/*.mjs', '**/*.css', '**/*.wasm', '**/*.webarchive'
        exclude 'test/**', 'androidTest/**', 'main/assets/site/**'
    }
    inputs.files(sources, pages)
    doLast {
        def offenders = sources.findAll { it.getText('UTF-8') =~ /(?:androidx?\.webkit\.|\bWebView\b)/ }
        if (!pages.isEmpty() || !offenders.isEmpty()) {
            throw new GradleException("TokenSeek requires native Android screens: " + (offenders + pages.files)*.name.join(', '))
        }
    }
}
tasks.named('preBuild') { dependsOn verifyNativeScreens }
