plugins {
    id 'com.android.application'
}

android {
    namespace 'io.tokenseek.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.tokenseek.app'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

def prepareChat = tasks.register('prepareChat', Exec) {
    workingDir rootDir
    commandLine 'bash', 'tools/build-web.sh'
    inputs.file rootProject.file('tools/build-web.sh')
    inputs.files rootProject.fileTree('web')
    outputs.dir file('src/main/assets/site')
}
tasks.named('preBuild') { dependsOn prepareChat }
