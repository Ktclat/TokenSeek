pluginManagement {
    repositories {
        google()
        // Shared GitHub runners can hit Maven Central's per-IP download limit.
        if (System.getenv('GITHUB_ACTIONS') == 'true') {
            maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        if (System.getenv('GITHUB_ACTIONS') == 'true') {
            maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        }
        mavenCentral()
    }
}
rootProject.name = 'TokenSeek'
include ':app'
