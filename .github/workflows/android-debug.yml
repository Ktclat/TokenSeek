name: Build Android APK
run-name: Android debug · ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch, tag, or commit
        required: true
        default: feature/android-native
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Android source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Check native screens, lint, and build
        run: >-
          ./gradlew --stacktrace :app:verifyNativeScreens :app:lintDebug
          :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run device tests on Android 14
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew --stacktrace :app:connectedDebugAndroidTest

      - name: Preserve diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

      - name: Verify signature and package APK
        id: package
        run: |
          apk_dir=app/build/outputs/apk/debug
          version=$(jq -er '.elements[0].versionName' "$apk_dir/output-metadata.json")
          apk="TokenSeek-$version-debug.apk"
          mkdir -p dist
          cp "$apk_dir/app-debug.apk" "dist/$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "dist/$apk"
          (cd dist && sha256sum "$apk" > SHA256SUMS && sha256sum --check SHA256SUMS)
          echo "artifact=TokenSeek-$version-debug" >> "$GITHUB_OUTPUT"
          {
            echo "Source commit: \`$(git rev-parse HEAD)\`"
            echo
            echo 'SHA-256'
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
